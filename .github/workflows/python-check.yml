name: Python Check

on:
  pull_request:
    paths:
      - "skills/**/*.py"
      - ".github/workflows/python-check.yml"
  push:
    branches: [main]
    paths:
      - "skills/**/*.py"
      - ".github/workflows/python-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff==0.16.2

      - name: Check Python
        run: |
          python -m compileall -q skills
          ruff check --select=E9,F63,F7,F82 skills

      - name: Test screenshot-to-code
        run: python -m unittest discover -s skills/iflytek-screenshot-to-code/tests -v
